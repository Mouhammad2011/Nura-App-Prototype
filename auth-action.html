<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nura — Account action</title>
  <style>
    :root{color-scheme:dark;--accent:#7c5cfc;--bg:#090b12;--card:#121722;--line:#334155;--text:#f8fafc;--muted:#b6c2d1}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#251a52,transparent 35%),var(--bg);font-family:Arial,sans-serif;color:var(--text)}
    main{width:min(440px,100%);padding:34px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 25px 90px #0009}.logo{letter-spacing:5px;color:#c4b5fd;font-weight:800;font-size:22px;margin-bottom:26px}h1{margin:0 0 10px;font-size:25px}p{color:var(--muted);line-height:1.55}.hidden{display:none}label{display:block;margin:18px 0 7px;font-size:13px;color:var(--muted)}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0b1020;color:var(--text);font:inherit}button,a.button{display:inline-block;margin-top:22px;padding:12px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:700 14px Arial,sans-serif;text-decoration:none;cursor:pointer}.error{color:#fca5a5}.success{color:#86efac}
  </style>
</head>
<body><main><div class="logo">NURA</div><section id="loading"><h1>Checking your link…</h1><p>Please wait.</p></section><section id="reset" class="hidden"><h1>Choose a new password</h1><p id="reset-email"></p><label for="password">New password</label><input id="password" type="password" minlength="6" autocomplete="new-password"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="6" autocomplete="new-password"><button id="reset-button">Reset password</button></section><section id="result" class="hidden"><h1 id="result-title"></h1><p id="result-message"></p><a class="button" id="continue" href="/">Return to Nura</a></section></main><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="js/auth-action.js"></script></body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nura — Account action</title>
  <style>
    :root{color-scheme:dark;--accent:#8b6cff;--bg:#080a11;--card:#121722;--line:#475569;--text:#f8fafc;--muted:#aeb9ca}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 18% 8%,#35236f 0,transparent 38%),radial-gradient(circle at 90% 95%,#17344a 0,transparent 37%),var(--bg);font-family:Arial,sans-serif;color:var(--text)}main{width:min(460px,100%);padding:38px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#18202e,#101520);box-shadow:0 28px 100px #000b}.logo{letter-spacing:5px;color:#ded8ff;font-weight:800;font-size:23px;margin-bottom:30px}h1{margin:0 0 10px;font-size:27px}p{color:var(--muted);line-height:1.6}.hidden{display:none}label{display:block;margin:18px 0 7px;font-size:13px;color:var(--muted)}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#090d16;color:var(--text);font:inherit}button,a.button{display:inline-block;margin-top:24px;padding:13px 18px;border:1px solid #a99bff;border-radius:11px;background:linear-gradient(135deg,#8b6cff,#6b4ff4);color:#fff;font:700 14px Arial,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 8px 22px #6b4ff455}.error{color:#fca5a5}.success{color:#86efac}
  </style>
</head>
<body><main><div class="logo">NURA</div><section id="loading"><h1>Checking your link…</h1><p>Please wait.</p></section><section id="reset" class="hidden"><h1>Choose a new password</h1><p id="reset-email"></p><label for="password">New password</label><input id="password" type="password" minlength="6" autocomplete="new-password"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="6" autocomplete="new-password"><button id="reset-button">Reset password</button></section><section id="result" class="hidden"><h1 id="result-title"></h1><p id="result-message"></p><a class="button" id="continue" href="/">Return to Nura</a></section></main><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="js/auth-action.js"></script></body>
</html>

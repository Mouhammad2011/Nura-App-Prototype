<!doctype html>
<html lang="en">
  <body style="margin:0;background:#090b12;color:#f4f4f6;font-family:Arial,sans-serif">
    <main style="max-width:560px;margin:32px auto;background:#121722;border:1px solid #334155;border-radius:18px;overflow:hidden">
      <header style="padding:28px 32px;background:linear-gradient(135deg,#1d1835,#121722)">
        <img src="https://YOUR-DOMAIN.example/nura-logo.png" width="56" alt="Nura" style="display:block;margin-bottom:14px">
        <div style="color:#b9a7ff;font-size:22px;font-weight:bold;letter-spacing:4px">NURA</div>
      </header>
      <section style="padding:30px 32px">
        <h1 style="font-size:23px;margin:0 0 12px;color:#fff">{{TITLE}}</h1>
        <p style="margin:0 0 22px;color:#cbd5e1;line-height:1.6">{{MESSAGE}}</p>
        <a href="{{ACTION_URL}}" style="display:inline-block;padding:13px 20px;background:#7c5cfc;color:#fff;text-decoration:none;border-radius:10px;font-weight:bold">{{ACTION_LABEL}}</a>
        <p style="margin:24px 0 0;color:#94a3b8;font-size:12px;line-height:1.5">If you did not request this, you can safely ignore this email.</p>
      </section>
    </main>
  </body>
</html>
